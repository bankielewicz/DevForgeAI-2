# DevForgeAI install manifest. Draft, 2026-09-03.
# Destinations are explicit; folder names are not a destination map.
# `devforgeai init` copies each source into the target project at the destination,
# preserving the subtree. `flatten: true` copies a tree's files one level deep into
# the destination, as the Agent Skills specification recommends for references/.
manifest_version: 1
entries:
  # machine-readable contracts -> .devforgeai/contracts. Installed first: the hook
  # runtime and the sequencer read error-taxonomy.yaml at start. Copied verbatim,
  # never templated or merged; the installer records each file's sha256 in
  # state.yaml#contracts so `devforgeai validate` can detect a hand-edited copy.
  # See framework/contracts/README.md for the full rule set.
  - source: framework/contracts
    destination: .devforgeai/contracts
    verbatim: true
    pin_digest: true
    order: 1
  - source: schemas/devforgeai/v1/pr-packet.schema.json
    destination: .devforgeai/contracts/schemas/pr-packet.schema.json
    verbatim: true
    pin_digest: true
    order: 1
  - source: schemas/devforgeai/v2/run.schema.json
    destination: .devforgeai/contracts/schemas/v2/run.schema.json
    verbatim: true
    pin_digest: true
    order: 1
  - source: schemas/devforgeai/v2/error-taxonomy.schema.json
    destination: .devforgeai/contracts/schemas/v2/error-taxonomy.schema.json
    verbatim: true
    pin_digest: true
    order: 1
  # provider-neutral framework material -> .devforgeai/
  - source: framework/skills
    destination: .devforgeai/skills
  # Claude Code adapters -> .claude/
  - source: providers/claude/skills
    destination: .claude/skills
  - source: providers/claude/agents
    destination: .claude/agents
  # Codex adapters: skills -> .agents/, agent profiles and hooks -> .codex/
  - source: providers/codex/skills
    destination: .agents/skills
  - source: providers/codex/agents
    destination: .codex/agents
  # derived copies: each adapter's references/ is produced from the neutral source,
  # never hand-maintained; skill-validator diffs them against framework/skills/<name>/
  - source: framework/skills/research
    destination: .claude/skills/research/references
    flatten: true
    derived: true
  - source: framework/skills/research
    destination: .agents/skills/research/references
    flatten: true
    derived: true
  - source: framework/skills/pr
    destination: .claude/skills/pr/references
    flatten: true
    derived: true
  - source: framework/skills/pr
    destination: .agents/skills/pr/references
    flatten: true
    derived: true
# Not installed by this manifest: components/research-core/ is the Python package,
# distributed as a wheel and required on PATH (devforgeai-research) at runtime.
