limitations:
  - "The validator is a staged promotion candidate (plan section 4.2), invoked as `PYTHONPATH=components/research-core/src python3 -m devforgeai.checkpoint validate --plan docs/research/spec-driven-development-gap-closure`; the authoritative executable is the future protected DevForge `devforge checkpoint validate`, so `proven` requires that pinned, root-owned install and CP-00 stays open until it exists (D-CP00-08)."
  - "Release-pin digests (executable, promotion and permissions evidence) are verified against local bytes only when the pinned path exists on the validating machine; on a machine without the protected install the validator checks the pin's shape, absoluteness and location, not its bytes."
  - "The candidate pin names a commit, so it is recorded in a second commit on the work branch (D-CP00-09); the work PR must merge with a merge commit, not a squash, or the pinned source commit disappears from the history."
  - "Reviewer independence is checked as inequality over self-reported identifier strings; the validator does not authenticate identities."
  - "The work happened in the Claude Code worktree directory `.claude/worktrees/cp-00-checkpoint-custody` rather than the plan's `worktrees/cp-00-checkpoint-custody`, because the Claude Code worktree tool only enters directories under `.claude/worktrees/`; the branch name `research/cp-00-checkpoint-custody` is the one the plan fixes."
  - "The schema is resolved from the repository checkout, not from wheel data-files, because the Research Core packaging contract freezes the shipped schema set; DevForge embeds the schema when it takes the validator."
reopen_if:
  - "DevForge releases a checkpoint validator whose embedded schema digest differs from `schemas/devforgeai/v1/research-gap-checkpoint.schema.json` at the closure commit."
  - "Claude Code or Codex CLI changes version before the two-terminal validator probe recorded under `docs/research/sdd-checkpoint-custody/probes/` is repeated on the new version."
  - "Any checkpoint record under this plan is accepted as `closed: true` by a path that did not run this validator with exit 0."
