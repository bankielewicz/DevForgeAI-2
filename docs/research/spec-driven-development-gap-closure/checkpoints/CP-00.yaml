limitations:
  - "Candidate `c784ab7` (the first pin) was found not promotion-eligible by the Codex security review of PR 20 (snapshot `sha256:55f244705de1243a43ef6c6882165f642a8020659c71fd4ab9d597e42892e92b`, dossier `reviews/codex-security-2026-09-04/`): fail-open release pin, caller-replaceable schema and repository root, S10 skipped without `--diff`, destructive probe design (D-CP00-11). Corrective-spec-001 was implemented red-first (D-CP00-12); the pin below names the corrected candidate. No promotion, installation or closure evidence until the corrected candidate passes independent exact-head review."
  - "Candidate `89be834` (the second pin, corrective 001) was found not promotion-eligible by the Codex exact-head review of PR 22 at `257ba7d` (dossier `reviews/codex-security-2026-09-04-pr22/`): inherited Git environment, executing release unbound from the record's release (CS-1.8), `LD_PRELOAD` before the shell wrapper, caller-selected closure range (D-CP00-13). Corrective-spec-002 is implemented red-first on the same branch; the record is UNBOUND with a null pin until the next pin commit. No promotion, installation or closure evidence until the corrected candidate passes independent exact-head review."
  - "The corrective work uses a second work branch, `research/cp-00-checkpoint-custody-fix1`, because the plan's CP-00 branch merged with PR 19; recorded deviation from plan section 5 (D-CP00-11)."
  - "The validator is a staged promotion candidate (plan section 4.2), invoked as `PYTHONPATH=components/research-core/src python3 -m devforgeai.checkpoint validate --plan docs/research/spec-driven-development-gap-closure`; the authoritative executable is the future protected DevForge `devforge checkpoint validate`, so `proven` requires that pinned, root-owned install and CP-00 stays open until it exists (D-CP00-08)."
  - "The positive protected case (a root-owned release tree accepted as the executing release, with a root-owned attestation) is testable in this repository only in-process through the `release_fs` seam with a fake that reports uid 0 and plays the executing root and the attestation directory; the CLI exposes no seam. The true positive integration test is DevForge's two-terminal probe against a real root-owned install (CS-1.7, CS-6.1, CS-9.2)."
  - "A `PROTECTED_RELEASE` or closed record validates only under the installed validator whose own release root is the record's (CS-6.1, CS-6.2): every release resource is mandatory and inspected on the filesystem, `RELEASE-IDENTITY.json` binds the record to the release (CS-6.4), and the closure range comes from the root-minted attestation at the fixed location (CS-9); the staged validator rejects every closed record, so CI on a plan with a closed record must run the installed `devforge`."
  - "Workspace-resident Git state (`.git/config`, `objects/info/alternates`, a linked worktree's `gitdir` pointer, the object store) stays agent-writable; the validator sanitizes only its Git process (CS-7.1). The attestation fixes head and record digest and the release identity fixes the candidate commit, so exploiting that state needs a second object with the same SHA-1 (CS-7.2)."
  - "The launcher's hostile tests (static ELF, `LD_PRELOAD`/`LD_AUDIT` inert, exact child environment) run against the binary built here with the pinned toolchain; DevForge must reproduce `launcher/BUILD-DIGEST.txt` or record why not (CS-8.6). A root-minted attestation and the positive protected case remain DevForge's two-terminal probe."
  - "Ownership and mode rules are POSIX; another operating system needs its own accepted realization (plan section 4.2). The interpreter and standard library are outside RELEASE.sha256 and are pinned by distro package in the permissions evidence (INSTALLED-LAYOUT.md rule 5)."
  - "Reviewer independence is checked as inequality over self-reported identifier strings; the validator does not authenticate identities."
  - "The work happened in the Claude Code worktree directory `.claude/worktrees/cp-00-checkpoint-custody` (and `.claude/worktrees/cp-00-fix1` for the corrective branch) rather than the plan's `worktrees/cp-00-checkpoint-custody`, because the Claude Code worktree tool only enters directories under `.claude/worktrees/`; accepted by the decision authority (D-CP00-05)."
  - "The candidate pin names a commit, so it is recorded in a later commit on the work branch (D-CP00-09); the work PR must merge with a merge commit, not a squash, or the pinned source commit disappears from the history."
reopen_if:
